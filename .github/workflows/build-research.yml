name: NCSG-only SG-DIFRA mathematical audit and research manuscript
on:
  push:
    branches: [main]
    paths:
      - 'manuscript/SG_DIFRA_REVISED.md'
      - 'manuscript/SG_DIFRA_EUROCRYPT_2028_RESEARCH_DRAFT.md'
      - 'research-2028/**'
      - 'formal-verification-and-mathematical-proofs/**'
      - '.github/workflows/build-research.yml'
  workflow_dispatch:
concurrency:
  group: ncsgaudit-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  audit-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Run finite mathematical regressions
        run: |
          python formal-verification-and-mathematical-proofs/test_sg_difra.py
          python formal-verification-and-mathematical-proofs/profile_bounds.py
          python research-2028/profile_cost_audit.py
          python research-2028/toy_hidden_mds_attack.py
          python research-2028/math/multidirection_cocycle.py
          python research-2028/attacks/public_ideal_membership_break.py
          python research-2028/attacks/ternary_affine_line_leakage.py
          python research-2028/attacks/fixed_field_mds_hbce_ppt_break.py
          python research-2028/attacks/ternary_parallel_line_collision.py
      - name: Install publishing tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pandoc libreoffice-writer libreoffice-math poppler-utils fonts-dejavu-core
      - name: Build editable Word and PDF
        run: |
          pandoc --standalone --from=markdown+tex_math_dollars+yaml_metadata_block manuscript/SG_DIFRA_REVISED.md --output manuscript/SG_DIFRA_REVISED.docx
          mkdir -p /tmp/sg-difra-lo
          libreoffice -env:UserInstallation=file:///tmp/sg-difra-lo --headless --convert-to pdf --outdir manuscript manuscript/SG_DIFRA_REVISED.docx
          pandoc --standalone --from=markdown+tex_math_dollars+yaml_metadata_block manuscript/SG_DIFRA_EUROCRYPT_2028_RESEARCH_DRAFT.md --output manuscript/SG_DIFRA_EUROCRYPT_2028_RESEARCH_DRAFT.docx
          libreoffice -env:UserInstallation=file:///tmp/sg-difra-lo --headless --convert-to pdf --outdir manuscript manuscript/SG_DIFRA_EUROCRYPT_2028_RESEARCH_DRAFT.docx
          test -s manuscript/SG_DIFRA_EUROCRYPT_2028_RESEARCH_DRAFT.docx
          test -s manuscript/SG_DIFRA_EUROCRYPT_2028_RESEARCH_DRAFT.pdf
          python formal-verification-and-mathematical-proofs/check_publishing_math.py manuscript/SG_DIFRA_EUROCRYPT_2028_RESEARCH_DRAFT.docx manuscript/SG_DIFRA_EUROCRYPT_2028_RESEARCH_DRAFT.pdf
          test -s manuscript/SG_DIFRA_REVISED.docx
          test -s manuscript/SG_DIFRA_REVISED.pdf
          python formal-verification-and-mathematical-proofs/check_publishing_math.py manuscript/SG_DIFRA_REVISED.docx manuscript/SG_DIFRA_REVISED.pdf
          file manuscript/SG_DIFRA_REVISED.docx manuscript/SG_DIFRA_REVISED.pdf manuscript/SG_DIFRA_EUROCRYPT_2028_RESEARCH_DRAFT.docx manuscript/SG_DIFRA_EUROCRYPT_2028_RESEARCH_DRAFT.pdf
      - name: Upload finished research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SG-DIFRA-NCSG-only-research-draft-PDF-and-DOCX
          path: |
            manuscript/SG_DIFRA_REVISED.docx
            manuscript/SG_DIFRA_REVISED.pdf
            manuscript/SG_DIFRA_EUROCRYPT_2028_RESEARCH_DRAFT.docx
            manuscript/SG_DIFRA_EUROCRYPT_2028_RESEARCH_DRAFT.pdf
      - name: Commit PDF and Word directly to research repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Generated binaries are authoritative from THIS build. Rebase the
          # index (not an already-created binary commit) onto fresh main so
          # concurrent documentation writes never cause binary merge conflicts.
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git diff --quiet origin/main HEAD -- manuscript/SG_DIFRA_EUROCRYPT_2028_RESEARCH_DRAFT.md; then
              echo "Manuscript source changed during CI; skip obsolete binaries" >&2
              exit 0
            fi
            git reset --mixed origin/main
            git add manuscript/SG_DIFRA_REVISED.docx manuscript/SG_DIFRA_REVISED.pdf manuscript/SG_DIFRA_EUROCRYPT_2028_RESEARCH_DRAFT.docx manuscript/SG_DIFRA_EUROCRYPT_2028_RESEARCH_DRAFT.pdf
            if git diff --cached --quiet; then
              echo "Published binaries already match main"
              exit 0
            fi
            git commit -m "Build SG-DIFRA revised audit manuscript PDF and DOCX [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent writer detected, refreshing main" >&2
          done
          exit 1
